<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda de Funerais — MIRA</title>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../../assets/firebase-config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--castanho:#8b7355;--castanho-claro:#c9a96e;--escuro:#111010;--texto:#f0ebe3;--muted:#7a7068;--linha:rgba(255,255,255,0.07)}
body{font-family:'Inter',sans-serif;background:var(--escuro);color:var(--texto);min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:0;background:linear-gradient(165deg,#1a1714 0%,#111010 40%,#0e0d0c 100%);pointer-events:none}
body::after{content:'';position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--castanho-claro),transparent);z-index:10}
.main{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:32px 20px 80px}
h1{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;margin-bottom:6px}
.subtitle{font-size:12px;color:var(--muted);margin-bottom:28px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.btn{background:rgba(139,115,85,0.2);border:1px solid rgba(139,115,85,0.4);color:var(--castanho-claro);padding:8px 18px;font-size:11px;font-family:'Inter',sans-serif;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:all .2s}
.btn:hover{background:rgba(139,115,85,0.35)}
.btn.primary{background:var(--castanho);border-color:var(--castanho);color:#fff}
.btn.primary:hover{background:var(--castanho-claro)}
.mes-nav{display:flex;align-items:center;gap:14px}
.mes-nav button{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 4px;line-height:1}
.mes-nav button:hover{color:var(--castanho-claro)}
.mes-label{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;min-width:200px;text-align:center}
/* CALENDÁRIO */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--linha);border:1px solid var(--linha);border-radius:4px;overflow:hidden;margin-bottom:20px}
.cal-head{background:#0a0908;padding:8px 4px;text-align:center;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cal-day{background:#111010;min-height:80px;padding:6px;cursor:pointer;transition:background .15s;position:relative}
.cal-day:hover{background:#1a1714}
.cal-day.outro-mes{opacity:.3}
.cal-day.hoje{background:#1a1c14}
.cal-day.hoje .cal-num{color:var(--castanho-claro)}
.cal-num{font-size:12px;font-weight:500;margin-bottom:4px}
.cal-evento{font-size:10px;background:rgba(139,115,85,0.25);border-left:2px solid var(--castanho);padding:2px 5px;border-radius:0 2px 2px 0;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-evento:hover{background:rgba(139,115,85,0.4)}
/* LISTA LATERAL */
.layout{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start}
@media(max-width:700px){.layout{grid-template-columns:1fr}}
.proximos{background:rgba(255,255,255,0.02);border:1px solid var(--linha);border-radius:4px;overflow:hidden;position:sticky;top:60px}
.proximos-header{background:rgba(255,255,255,0.04);border-bottom:1px solid var(--linha);padding:10px 14px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--castanho)}
.proximo-item{padding:12px 14px;border-bottom:1px solid var(--linha);cursor:pointer;transition:background .15s}
.proximo-item:hover{background:rgba(255,255,255,0.04)}
.proximo-item:last-child{border-bottom:none}
.proximo-data{font-size:10px;color:var(--castanho-claro);font-weight:600;letter-spacing:.08em;margin-bottom:3px}
.proximo-nome{font-size:13px;font-weight:500;margin-bottom:2px}
.proximo-local{font-size:11px;color:var(--muted)}
.empty-proximos{padding:24px;text-align:center;font-size:12px;color:var(--muted)}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#1a1714;border:1px solid rgba(255,255,255,0.1);border-radius:6px;width:100%;max-width:480px;overflow:hidden}
.modal-header{background:rgba(139,115,85,0.15);border-bottom:1px solid rgba(255,255,255,0.07);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400}
.modal-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
.modal-body{padding:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:3px;padding:9px 12px;font-size:13px;color:var(--texto);font-family:'Inter',sans-serif;outline:none}
.field textarea{min-height:72px;resize:vertical}
.modal-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,0.07);display:flex;gap:10px;justify-content:flex-end}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.estado-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.est-agendado{background:rgba(30,50,80,0.5);color:#7aaaee}
.est-concluido{background:rgba(30,70,40,0.5);color:#7add99}
.est-cancelado{background:rgba(80,30,30,0.5);color:#ee8888}
</style>
</head>
<body>
<div id="mira-navbar" style="width:100%;background:#0e0d0c;border-bottom:1px solid rgba(255,255,255,0.07);padding:0 24px;height:44px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:9999;box-sizing:border-box;font-family:Inter,sans-serif"><a href="../../index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:rgba(255,255,255,0.5);font-size:11px;letter-spacing:0.1em;text-transform:uppercase" onmouseover="this.style.color='#c9a96e'" onmouseout="this.style.color='rgba(255,255,255,0.5)'"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>Plataforma</a><img src="../../assets/logo.png" style="height:20px;filter:brightness(0) invert(1) opacity(.4)" alt="MIRA" onerror="this.style.display='none'"><span style="font-size:10px;color:rgba(255,255,255,0.18);letter-spacing:0.06em">mmira.pt</span></div>
<div class="main">
  <h1>Agenda de Funerais</h1>
  <div class="subtitle">Agência Funerária Mira · Gestão de serviços</div>

  <div class="toolbar">
    <div class="mes-nav">
      <button onclick="mudarMes(-1)">‹</button>
      <div class="mes-label" id="mes-label"></div>
      <button onclick="mudarMes(1)">›</button>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="irHoje()">Hoje</button>
      <button class="btn primary" onclick="abrirModal()">+ Novo serviço</button>
    </div>
  </div>

  <div class="layout">
    <div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div class="proximos">
      <div class="proximos-header">Próximos Serviços</div>
      <div id="proximos-lista"><div class="empty-proximos">A carregar...</div></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)fecharModal()">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-titulo">Novo Serviço</h3>
      <button class="modal-close" onclick="fecharModal()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="modal-id">
      <div class="field"><label>Família / Falecido</label><input type="text" id="f-nome" placeholder="Nome do falecido ou família..."></div>
      <div class="grid-2">
        <div class="field"><label>Data</label><input type="date" id="f-data"></div>
        <div class="field"><label>Hora</label><input type="time" id="f-hora"></div>
      </div>
      <div class="field"><label>Local</label><input type="text" id="f-local" placeholder="Igreja, cemitério, residência..."></div>
      <div class="field"><label>Estado</label>
        <select id="f-estado">
          <option value="agendado">Agendado</option>
          <option value="concluido">Concluído</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>
      <div class="field"><label>Notas</label><textarea id="f-notas" placeholder="Tarefeiros, instruções especiais..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="btn-eliminar" onclick="eliminarServico()" style="display:none;color:#e88;border-color:#e88">Eliminar</button>
      <button class="btn" onclick="fecharModal()">Cancelar</button>
      <button class="btn primary" onclick="gravarServico()">Gravar</button>
    </div>
  </div>
</div>

<script>
let db = null;
try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); } catch(e) {}

let anoAtual = new Date().getFullYear();
let mesAtual = new Date().getMonth();
let servicos = [];
let editId = null;

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS_SEMANA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

function mudarMes(delta) { mesAtual += delta; if(mesAtual>11){mesAtual=0;anoAtual++;} if(mesAtual<0){mesAtual=11;anoAtual--;} renderCal(); }
function irHoje() { const h=new Date(); anoAtual=h.getFullYear(); mesAtual=h.getMonth(); renderCal(); }

async function carregarServicos() {
  if(!db) return;
  const snap = await db.collection('agenda-funerais').orderBy('data','asc').get();
  servicos = snap.docs.map(d => ({id:d.id,...d.data()}));
  renderCal();
  renderProximos();
}

function renderCal() {
  document.getElementById('mes-label').textContent = MESES[mesAtual] + ' ' + anoAtual;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = DIAS_SEMANA.map(d=>`<div class="cal-head">${d}</div>`).join('');

  const primeiroDia = new Date(anoAtual, mesAtual, 1).getDay();
  const diasMes = new Date(anoAtual, mesAtual+1, 0).getDate();
  const diasMesAnt = new Date(anoAtual, mesAtual, 0).getDate();
  const hoje = new Date();

  for(let i=0; i<primeiroDia; i++) {
    const d = diasMesAnt - primeiroDia + i + 1;
    grid.innerHTML += `<div class="cal-day outro-mes"><div class="cal-num">${d}</div></div>`;
  }

  for(let d=1; d<=diasMes; d++) {
    const dataStr = `${anoAtual}-${String(mesAtual+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const eHoje = hoje.getFullYear()===anoAtual && hoje.getMonth()===mesAtual && hoje.getDate()===d;
    const evsDay = servicos.filter(s=>s.data===dataStr);
    const evsHtml = evsDay.map(s=>`<div class="cal-evento" onclick="editarServico('${s.id}');event.stopPropagation()">${s.hora||''} ${s.nome}</div>`).join('');
    grid.innerHTML += `<div class="cal-day${eHoje?' hoje':''}" onclick="abrirModal('${dataStr}')"><div class="cal-num">${d}</div>${evsHtml}</div>`;
  }

  const restantes = (7 - (primeiroDia + diasMes) % 7) % 7;
  for(let i=1; i<=restantes; i++) {
    grid.innerHTML += `<div class="cal-day outro-mes"><div class="cal-num">${i}</div></div>`;
  }
}

function renderProximos() {
  const hoje = new Date().toISOString().split('T')[0];
  const proximos = servicos.filter(s=>s.data>=hoje && s.estado!=='cancelado').slice(0,8);
  const el = document.getElementById('proximos-lista');
  if(!proximos.length) { el.innerHTML='<div class="empty-proximos">Sem serviços agendados</div>'; return; }
  el.innerHTML = proximos.map(s=>{
    const d = new Date(s.data+'T12:00:00');
    const dFmt = d.toLocaleDateString('pt-PT',{day:'numeric',month:'short'});
    const badge = {agendado:'est-agendado',concluido:'est-concluido',cancelado:'est-cancelado'}[s.estado]||'est-agendado';
    return `<div class="proximo-item" onclick="editarServico('${s.id}')">
      <div class="proximo-data">${dFmt} ${s.hora||''}</div>
      <div class="proximo-nome">${s.nome}</div>
      <div class="proximo-local">${s.local||'—'}</div>
    </div>`;
  }).join('');
}

function abrirModal(data='') {
  editId = null;
  document.getElementById('modal-titulo').textContent = 'Novo Serviço';
  document.getElementById('modal-id').value = '';
  document.getElementById('f-nome').value = '';
  document.getElementById('f-data').value = data;
  document.getElementById('f-hora').value = '';
  document.getElementById('f-local').value = '';
  document.getElementById('f-estado').value = 'agendado';
  document.getElementById('f-notas').value = '';
  document.getElementById('btn-eliminar').style.display = 'none';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-nome').focus(),100);
}

function editarServico(id) {
  const s = servicos.find(x=>x.id===id);
  if(!s) return;
  editId = id;
  document.getElementById('modal-titulo').textContent = 'Editar Serviço';
  document.getElementById('f-nome').value = s.nome||'';
  document.getElementById('f-data').value = s.data||'';
  document.getElementById('f-hora').value = s.hora||'';
  document.getElementById('f-local').value = s.local||'';
  document.getElementById('f-estado').value = s.estado||'agendado';
  document.getElementById('f-notas').value = s.notas||'';
  document.getElementById('btn-eliminar').style.display = '';
  document.getElementById('modal-overlay').classList.add('open');
}

function fecharModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editId = null;
}

async function gravarServico() {
  if(!db) { alert('Firebase não disponível'); return; }
  const nome = document.getElementById('f-nome').value.trim();
  if(!nome) { document.getElementById('f-nome').focus(); return; }
  const doc = {
    nome, data:document.getElementById('f-data').value,
    hora:document.getElementById('f-hora').value,
    local:document.getElementById('f-local').value,
    estado:document.getElementById('f-estado').value,
    notas:document.getElementById('f-notas').value,
    criadoEm:new Date().toISOString()
  };
  const id = editId || ('FUN-'+Date.now());
  await db.collection('agenda-funerais').doc(id).set(doc,{merge:true});
  fecharModal();
  carregarServicos();
}

async function eliminarServico() {
  if(!editId||!db) return;
  if(!confirm('Eliminar este serviço?')) return;
  await db.collection('agenda-funerais').doc(editId).delete();
  fecharModal();
  carregarServicos();
}

carregarServicos();
</script>
</body>
</html>
