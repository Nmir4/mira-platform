<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contactos — MIRA</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../../assets/firebase-config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--castanho:#8b7355;--castanho-claro:#c9a96e;--escuro:#111010;--texto:#f0ebe3;--muted:#7a7068;--linha:rgba(255,255,255,0.07)}
html,body{min-height:100%;background:var(--escuro);color:var(--texto);font-family:'Inter',sans-serif;font-size:21px}
body::before{content:'';position:fixed;inset:0;z-index:0;background:linear-gradient(165deg,#1a1714 0%,#111010 40%,#0e0d0c 100%);pointer-events:none}
body::after{content:'';position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--castanho-claro),transparent);z-index:10}
nav{width:100%;background:#0e0d0c;border-bottom:1px solid rgba(255,255,255,0.07);padding:0 33px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:999}
nav a{display:flex;align-items:center;gap:12px;text-decoration:none;color:rgba(255,255,255,0.5);font-size:17px;letter-spacing:0.08em;text-transform:uppercase;transition:color .2s}
nav a:hover{color:#c9a96e}
.main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:33px 28px 94px}
/* TOOLBAR */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:14px}
.toolbar h1{font-family:'Cormorant Garamond',serif;font-size:33px;font-weight:400}
.toolbar-right{display:flex;gap:12px;align-items:center}
.search-input{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;padding:12px 19px;font-size:17px;color:var(--texto);font-family:'Inter',sans-serif;outline:none;width:240px;transition:border-color .2s}
.search-input:focus{border-color:var(--castanho-claro)}
.btn{padding:12px 24px;font-size:15px;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:0.08em;border-radius:4px;cursor:pointer;transition:all .2s;border:1px solid var(--castanho);background:var(--castanho);color:#fff}
.btn:hover{background:var(--castanho-claro);border-color:var(--castanho-claro)}
.btn-outline{background:transparent;border-color:var(--linha);color:var(--muted)}
.btn-outline:hover{border-color:var(--castanho);color:var(--castanho-claro)}
/* FILTROS POR CATEGORIA */
.cat-filters{display:flex;gap:9px;margin-bottom:20px;flex-wrap:wrap}
.cat-btn{padding:8px 19px;font-size:15px;font-family:'Inter',sans-serif;border:1px solid var(--linha);background:transparent;color:var(--muted);cursor:pointer;border-radius:20px;transition:all .15s}
.cat-btn.active{background:var(--castanho);border-color:var(--castanho);color:#fff}
/* GRID DE CONTACTOS */
.contacts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:17px}
.contact-card{background:rgba(255,255,255,0.025);border:1px solid var(--linha);border-radius:4px;padding:21px 24px;transition:all .2s;cursor:pointer;position:relative}
.contact-card:hover{background:rgba(255,255,255,0.05);border-color:rgba(201,169,110,0.3);transform:translateY(-2px)}
.contact-cat{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:var(--castanho);margin-bottom:6px}
.contact-nome{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;margin-bottom:10px;line-height:1.2}
.contact-info{display:flex;flex-direction:column;gap:6px}
.contact-linha{display:flex;align-items:center;gap:9px;font-size:17px;color:var(--muted)}
.contact-linha a{color:var(--texto);text-decoration:none;transition:color .15s}
.contact-linha a:hover{color:var(--castanho-claro)}
.contact-icon{font-size:17px;width:18px;text-align:center;flex-shrink:0}
.contact-edit{position:absolute;top:12px;right:12px;background:none;border:none;color:rgba(255,255,255,0.2);font-size:18px;cursor:pointer;transition:color .15s;padding:2px 6px}
.contact-edit:hover{color:var(--castanho-claro)}
.loading{padding:47px;text-align:center;font-size:17px;color:var(--muted)}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;display:none;align-items:center;justify-content:center;padding:24px}
.overlay.open{display:flex}
.modal{background:#1c1a17;border:1px solid rgba(255,255,255,0.1);border-radius:8px;width:100%;max-width:500px;overflow:hidden}
.modal-header{background:rgba(139,115,85,0.15);border-bottom:1px solid rgba(255,255,255,0.07);padding:19px 26px;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400}
.modal-close{background:none;border:none;color:var(--muted);font-size:28px;cursor:pointer}
.modal-body{padding:26px;display:flex;flex-direction:column;gap:17px}
.field label{display:block;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:4px;padding:12px 17px;font-size:18px;color:var(--texto);font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus{border-color:var(--castanho-claro)}
.field select option{background:#1c1a17}
.field textarea{min-height:70px;resize:vertical}
.modal-footer{padding:17px 26px;border-top:1px solid rgba(255,255,255,0.07);display:flex;gap:12px;justify-content:flex-end}
.btn-cancel{background:transparent;border:1px solid var(--linha);color:var(--muted);padding:12px 21px;font-size:15px;border-radius:4px;cursor:pointer;font-family:'Inter',sans-serif}
.btn-save{background:var(--castanho);border:none;color:#fff;padding:12px 24px;font-size:15px;border-radius:4px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500}
.btn-save:hover{background:var(--castanho-claro)}
.btn-del{background:transparent;border:1px solid rgba(200,80,80,0.4);color:#e88;padding:12px 19px;font-size:15px;border-radius:4px;cursor:pointer;font-family:'Inter',sans-serif;margin-right:auto}
</style>
</head>
<body>
<nav>
  <a href="../../index.html">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Plataforma
  </a>
  <span style="font-size:15px;color:rgba(255,255,255,0.3);letter-spacing:0.1em">Agenda de Contactos</span>
  <img src="../../assets/logo.png" style="height:22px;filter:brightness(0) invert(1) opacity(.35)" alt="MIRA" onerror="this.style.display='none'">
</nav>

<div class="main">
  <div class="toolbar">
    <h1>Contactos</h1>
    <div class="toolbar-right">
      <input type="text" class="search-input" id="search" placeholder="🔍 Pesquisar..." oninput="filtrar()">
      <button class="btn" onclick="abrirModal()">+ Novo contacto</button>
    </div>
  </div>

  <div class="cat-filters" id="cat-filters">
    <button class="cat-btn active" onclick="setCat('',this)">Todos</button>
  </div>

  <div class="contacts-grid" id="contacts-grid">
    <div class="loading">A carregar contactos...</div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="if(event.target===this)fecharModal()">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-titulo">Novo Contacto</h3>
      <button class="modal-close" onclick="fecharModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Nome / Entidade</label><input type="text" id="f-nome" placeholder="Nome ou entidade..."></div>
      <div class="field"><label>Categoria</label>
        <select id="f-cat">
          <option value="Instituição Pública">Instituição Pública</option>
          <option value="Saúde">Saúde</option>
          <option value="Segurança">Segurança</option>
          <option value="Justiça / Notariado">Justiça / Notariado</option>
          <option value="Junta de Freguesia">Junta de Freguesia</option>
          <option value="Parceiro / Fornecedor">Parceiro / Fornecedor</option>
          <option value="Advogado / Solicitador">Advogado / Solicitador</option>
          <option value="Igreja / Religioso">Igreja / Religioso</option>
          <option value="Frota / Mecânica">Frota / Mecânica</option>
          <option value="Cliente">Cliente</option>
          <option value="Outro">Outro</option>
        </select>
      </div>
      <div class="field"><label>Telefone</label><input type="text" id="f-tel" placeholder="251 000 000"></div>
      <div class="field"><label>Email</label><input type="email" id="f-email" placeholder="email@exemplo.pt"></div>
      <div class="field"><label>Morada</label><input type="text" id="f-morada" placeholder="Rua, localidade..."></div>
      <div class="field"><label>Website</label><input type="text" id="f-web" placeholder="www.exemplo.pt"></div>
      <div class="field"><label>Notas</label><textarea id="f-notas" placeholder="Pessoa de contacto, horários, observações..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn-del" id="btn-del" onclick="eliminarContacto()" style="display:none">Eliminar</button>
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="gravarContacto()">Gravar</button>
    </div>
  </div>
</div>

<script>
let db = null, editId = null, todosContactos = [], catActiva = '';
try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); } catch(e) {}

// Contactos pré-carregados (instituições de Melgaço)
const CONTACTOS_INICIAIS = [
  {nome:'Câmara Municipal de Melgaço',cat:'Instituição Pública',telefone:'251 410 100',email:'geral@cm-melgaco.pt',morada:'Largo Hermenegildo Solheiro, 4960-551 Melgaço',web:'www.cm-melgaco.pt',notas:'Horário: 2ª a 6ª, 09h-17h. Atendimento: atendimento@cm-melgaco.pt'},
  {nome:'Assembleia Municipal de Melgaço',cat:'Instituição Pública',telefone:'251 410 108',email:'assembleia.municipal@cm-melgaco.pt',morada:'Largo Hermenegildo Solheiro, 4960-551 Melgaço',web:'',notas:''},
  {nome:'Centro de Saúde de Melgaço (UCSP)',cat:'Saúde',telefone:'251 400 330',email:'ucsp.melgaco@ulsam.min-saude.pt',morada:'Rua Fonte da Vila, s/n, 4960-546 Melgaço',web:'www.ulsam.min-saude.pt',notas:'Fax: 251 400 333. Linha Azul (só informações): 251 403 618. Internamento: 251 400 338. Horário: 2ª a 6ª, 08h-20h'},
  {nome:'UCC Melgaço (Unidade Cuidados Comunidade)',cat:'Saúde',telefone:'251 400 336',email:'ucc.melgaco@ulsam.min-saude.pt',morada:'Rua Fonte da Vila, 278, 4960-546 Melgaço',web:'',notas:'Enf. Coordenadora: Ana Pires'},
  {nome:'GNR — Posto Territorial de Melgaço',cat:'Segurança',telefone:'251 404 960',email:'ct.vct.dvln.pmlg@gnr.pt',morada:'Rua do Fecho, 20 - Roussas, 4960-366 Melgaço',web:'www.gnr.pt',notas:'Fax: 251 402 346. Horário: Permanente. Emergência: 112'},
  {nome:'Serviço de Finanças de Melgaço',cat:'Instituição Pública',telefone:'251 402 338',email:'',morada:'Rua Doutor António Durães, 4960-522 Melgaço',web:'portaldasfinancas.gov.pt',notas:'Horário: 09h-12h30 e 14h-16h30'},
  {nome:'Segurança Social — Serviço Local de Melgaço',cat:'Instituição Pública',telefone:'300 502 502',email:'',morada:'Rua Dr. José Cândido Gomes de Abreu, 23, 4960-554 Melgaço',web:'www.seg-social.pt',notas:'Horário: Dias úteis 09h-13h e 14h-16h. Feriado Municipal: Quinta-feira de Ascensão. Linha nacional: 300 502 502'},
  {nome:'Conservatória do Registo Civil e Predial de Melgaço',cat:'Justiça / Notariado',telefone:'251 400 030',email:'',morada:'Largo Hermenegildo Solheiro, n.º 234, 4960-551 Melgaço',web:'irn.justica.gov.pt',notas:'Inclui Cartório Notarial. Horário: 2ª a 6ª, 09h-16h. Encerra fins de semana, feriados e feriado municipal (5ª feira da Ascensão). Agendamentos: justica.gov.pt'},
  {nome:'Loja Interativa de Turismo de Melgaço',cat:'Instituição Pública',telefone:'251 402 440',email:'turismo@cm-melgaco.pt',morada:'Praça da República, 133, 4960-567 Melgaço',web:'www.portoenorte.pt',notas:'Horário Verão (Abr-Set): 09h30-13h / 14h-18h. Horário Inverno (Out-Mar): 09h30-13h / 14h-17h'},
  {nome:'Museu de Cinema de Melgaço',cat:'Instituição Pública',telefone:'251 401 575',email:'museudecinema@cm-melgaco.pt',morada:'Rua do Carvalho – Centro Histórico, Melgaço',web:'',notas:''},
  {nome:'Emergência Médica',cat:'Saúde',telefone:'112',email:'',morada:'',web:'',notas:'Linha de Emergência Nacional'},
  {nome:'SNS 24',cat:'Saúde',telefone:'808 24 24 24',email:'',morada:'',web:'sns24.gov.pt',notas:'Linha de saúde não urgente, 24h'},
  {nome:'Unidade Local de Saúde do Alto Minho (ULSAM)',cat:'Saúde',telefone:'258 802 100',email:'',morada:'Estrada de Santa Luzia, 4901-858 Viana do Castelo',web:'www.ulsam.min-saude.pt',notas:'Hospital de referência do Alto Minho'},
];

async function iniciarContactos() {
  if(!db) return;
  // Verificar se já existem contactos na BD
  const snap = await db.collection('contactos').limit(1).get();
  if(snap.empty) {
    // Importar contactos iniciais
    const batch = db.batch();
    CONTACTOS_INICIAIS.forEach((c,i) => {
      const ref = db.collection('contactos').doc('INI-'+i);
      batch.set(ref, {...c, criadoEm: new Date().toISOString()});
    });
    await batch.commit();
  }
  carregarContactos();
}

async function carregarContactos() {
  if(!db) return;
  try {
    const snap = await db.collection('contactos').orderBy('nome','asc').get();
    todosContactos = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderCategorias();
    filtrar();
  } catch(e) {
    document.getElementById('contacts-grid').innerHTML = '<div class="loading">Erro ao carregar: '+e.message+'</div>';
  }
}

function renderCategorias() {
  const cats = [...new Set(todosContactos.map(c=>c.cat).filter(Boolean))].sort();
  const filtersEl = document.getElementById('cat-filters');
  filtersEl.innerHTML = '<button class="cat-btn active" onclick="setCat(\'\',this)">Todos ('+todosContactos.length+')</button>';
  cats.forEach(cat => {
    const count = todosContactos.filter(c=>c.cat===cat).length;
    filtersEl.innerHTML += `<button class="cat-btn" onclick="setCat('${cat}',this)">${cat} (${count})</button>`;
  });
}

function setCat(cat, btn) {
  catActiva = cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filtrar();
}

function filtrar() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  let lista = todosContactos;
  if(catActiva) lista = lista.filter(c=>c.cat===catActiva);
  if(q) lista = lista.filter(c=>(c.nome||'').toLowerCase().includes(q)||(c.telefone||'').includes(q)||(c.email||'').toLowerCase().includes(q)||(c.notas||'').toLowerCase().includes(q));
  renderContactos(lista);
}

function renderContactos(lista) {
  const grid = document.getElementById('contacts-grid');
  if(!lista.length){grid.innerHTML='<div class="loading">Nenhum contacto encontrado.</div>';return;}
  grid.innerHTML = lista.map(c=>`
    <div class="contact-card" onclick="editarContacto('${c.id}')">
      <button class="contact-edit" onclick="event.stopPropagation();editarContacto('${c.id}')">✏</button>
      <div class="contact-cat">${c.cat||'—'}</div>
      <div class="contact-nome">${c.nome||'—'}</div>
      <div class="contact-info">
        ${c.telefone?`<div class="contact-linha"><span class="contact-icon">📞</span><a href="tel:${c.telefone.replace(/\s/g,'')}" onclick="event.stopPropagation()">${c.telefone}</a></div>`:''}
        ${c.email?`<div class="contact-linha"><span class="contact-icon">✉️</span><a href="mailto:${c.email}" onclick="event.stopPropagation()">${c.email}</a></div>`:''}
        ${c.morada?`<div class="contact-linha"><span class="contact-icon">📍</span><span>${c.morada}</span></div>`:''}
        ${c.web?`<div class="contact-linha"><span class="contact-icon">🌐</span><a href="${c.web.startsWith('http')?c.web:'https://'+c.web}" target="_blank" onclick="event.stopPropagation()">${c.web}</a></div>`:''}
        ${c.notas?`<div class="contact-linha" style="margin-top:4px"><span class="contact-icon">📝</span><span style="font-size:14px;color:var(--muted)">${c.notas.substring(0,80)}${c.notas.length>80?'…':''}</span></div>`:''}
      </div>
    </div>`).join('');
}

function abrirModal(data='') {
  editId=null;
  document.getElementById('modal-titulo').textContent='Novo Contacto';
  ['f-nome','f-tel','f-email','f-morada','f-web','f-notas'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-cat').value='Instituição Pública';
  document.getElementById('btn-del').style.display='none';
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-nome').focus(),100);
}

function editarContacto(id) {
  const c=todosContactos.find(x=>x.id===id);if(!c)return;
  editId=id;
  document.getElementById('modal-titulo').textContent='Editar Contacto';
  document.getElementById('f-nome').value=c.nome||'';
  document.getElementById('f-cat').value=c.cat||'Outro';
  document.getElementById('f-tel').value=c.telefone||'';
  document.getElementById('f-email').value=c.email||'';
  document.getElementById('f-morada').value=c.morada||'';
  document.getElementById('f-web').value=c.web||'';
  document.getElementById('f-notas').value=c.notas||'';
  document.getElementById('btn-del').style.display='';
  document.getElementById('overlay').classList.add('open');
}

function fecharModal(){document.getElementById('overlay').classList.remove('open');editId=null;}

async function gravarContacto() {
  if(!db)return;
  const nome=document.getElementById('f-nome').value.trim();
  if(!nome){document.getElementById('f-nome').focus();return;}
  const doc={
    nome,cat:document.getElementById('f-cat').value,
    telefone:document.getElementById('f-tel').value.trim(),
    email:document.getElementById('f-email').value.trim(),
    morada:document.getElementById('f-morada').value.trim(),
    web:document.getElementById('f-web').value.trim(),
    notas:document.getElementById('f-notas').value.trim(),
    criadoEm:new Date().toISOString()
  };
  const id=editId||('CT-'+Date.now());
  await db.collection('contactos').doc(id).set(doc,{merge:true});
  fecharModal();
  carregarContactos();
}

async function eliminarContacto(){
  if(!editId||!db)return;
  if(!confirm('Eliminar este contacto?'))return;
  await db.collection('contactos').doc(editId).delete();
  fecharModal();
  carregarContactos();
}

iniciarContactos();
</script>
</body>
</html>
