<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--castanho:#8b7355;--castanho-claro:#c9a96e;--escuro:#111010;--texto:#f0ebe3;--muted:#7a7068;--linha:rgba(255,255,255,0.07)}
html,body{min-height:100%;background:var(--escuro);color:var(--texto);font-family:'Inter',sans-serif;font-size:18px}
body::before{content:'';position:fixed;inset:0;z-index:0;background:linear-gradient(165deg,#1a1714 0%,#111010 40%,#0e0d0c 100%);pointer-events:none}
body::after{content:'';position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--castanho-claro),transparent);z-index:10}
nav{width:100%;background:#0e0d0c;border-bottom:1px solid rgba(255,255,255,0.07);padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:999}
nav a{display:flex;align-items:center;gap:10px;text-decoration:none;color:rgba(255,255,255,0.5);font-size:15px;letter-spacing:0.08em;text-transform:uppercase;transition:color .2s}
nav a:hover{color:#c9a96e}
.main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:28px 24px 80px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:14px}
.toolbar h1{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:400}
.toolbar-right{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search-wrap{position:relative}
.search-input{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:4px;padding:11px 16px 11px 42px;font-size:15px;color:var(--texto);font-family:'Inter',sans-serif;outline:none;width:260px;transition:border-color .2s}
.search-input:focus{border-color:var(--castanho-claro)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;pointer-events:none}
.btn{padding:11px 22px;font-size:14px;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:0.08em;border-radius:4px;cursor:pointer;transition:all .2s;border:1px solid var(--castanho);background:var(--castanho);color:#fff}
.btn:hover{background:var(--castanho-claro);border-color:var(--castanho-claro)}
/* CATEGORIAS SIDEBAR + GRID */
.layout{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
@media(max-width:700px){.layout{grid-template-columns:1fr}}
/* SIDEBAR CATEGORIAS */
.sidebar{background:rgba(255,255,255,0.025);border:1px solid var(--linha);border-radius:4px;overflow:hidden;position:sticky;top:72px}
.sidebar-header{background:rgba(255,255,255,0.04);border-bottom:1px solid var(--linha);padding:12px 16px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--castanho)}
.cat-item{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:all .15s;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.cat-item:last-child{border-bottom:none}
.cat-item:hover{background:rgba(255,255,255,0.04);color:var(--castanho-claro)}
.cat-item.active{background:rgba(139,115,85,0.15);color:var(--castanho-claro);font-weight:600}
.cat-count{font-size:12px;color:var(--muted);background:rgba(255,255,255,0.05);padding:2px 8px;border-radius:10px}
.cat-item.active .cat-count{color:var(--castanho)}
/* CONTACTOS */
.contacts-grid{display:flex;flex-direction:column;gap:10px}
.contact-card{background:rgba(255,255,255,0.025);border:1px solid var(--linha);border-radius:4px;padding:20px 22px;transition:all .2s;position:relative;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.contact-card:hover{background:rgba(255,255,255,0.05);border-color:rgba(201,169,110,0.25)}
.contact-main{}
.contact-cat-badge{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:var(--castanho);margin-bottom:6px}
.contact-nome{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;margin-bottom:12px;line-height:1.2}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.contact-linha{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--muted);line-height:1.4}
.contact-linha a{color:var(--texto);text-decoration:none;transition:color .15s}
.contact-linha a:hover{color:var(--castanho-claro)}
.contact-icon{font-size:14px;flex-shrink:0;margin-top:1px}
.contact-notas{font-size:13px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.04);line-height:1.5}
.contact-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.action-btn{background:none;border:1px solid var(--linha);color:var(--muted);padding:7px 12px;border-radius:3px;cursor:pointer;font-size:13px;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap}
.action-btn:hover{border-color:var(--castanho);color:var(--castanho-claro)}
.action-btn.danger:hover{border-color:#e88;color:#e88}
.empty-msg{padding:40px;text-align:center;font-size:15px;color:var(--muted);background:rgba(255,255,255,0.02);border:1px solid var(--linha);border-radius:4px}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:#1c1a17;border:1px solid rgba(255,255,255,0.1);border-radius:8px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-header{background:rgba(139,115,85,0.15);border-bottom:1px solid rgba(255,255,255,0.07);padding:18px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1}
.modal-header h3{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400}
.modal-close{background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
.modal-body{padding:24px;display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:4px;padding:11px 14px;font-size:16px;color:var(--texto);font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--castanho-claro)}
.field select option{background:#1c1a17}
.field textarea{min-height:80px;resize:vertical}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-footer{padding:16px 24px;border-top:1px solid rgba(255,255,255,0.07);display:flex;gap:10px;justify-content:flex-end}
.btn-cancel{background:transparent;border:1px solid var(--linha);color:var(--muted);padding:10px 18px;font-size:14px;border-radius:4px;cursor:pointer;font-family:'Inter',sans-serif}
.btn-cancel:hover{border-color:var(--castanho);color:var(--castanho-claro)}
.btn-save{background:var(--castanho);border:none;color:#fff;padding:10px 22px;font-size:14px;border-radius:4px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500}
.btn-save:hover{background:var(--castanho-claro)}
.btn-del{background:transparent;border:1px solid rgba(200,80,80,0.4);color:#e88;padding:10px 16px;font-size:14px;border-radius:4px;cursor:pointer;font-family:'Inter',sans-serif;margin-right:auto}
</style>

<div class="main">

    </div>
  </div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="if(event.target===this)fecharModal()">
  <div class="modal">

      <button class="modal-close" onclick="fecharModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Nome / Entidade</label><input type="text" id="f-nome" placeholder="Nome ou entidade..."></div>
      <div class="field"><label>Categoria</label>
        <select id="f-cat">
          <option value="Emergência">🆘 Emergência</option>
          <option value="Autarquia">🏛 Autarquia</option>
          <option value="Junta de Freguesia">🏘 Junta de Freguesia</option>
          <option value="Saúde">🏥 Saúde</option>
          <option value="Segurança">🛡 Segurança</option>
          <option value="Justiça / Notariado">⚖️ Justiça / Notariado</option>
          <option value="Serviços Públicos">📋 Serviços Públicos</option>
          <option value="Igreja / Religioso">⛪ Igreja / Religioso</option>
          <option value="Parceiro / Fornecedor">🤝 Parceiro / Fornecedor</option>
          <option value="Advogado / Solicitador">📜 Advogado / Solicitador</option>
          <option value="Frota / Mecânica">🚗 Frota / Mecânica</option>
          <option value="Cliente">👤 Cliente</option>
          <option value="Outro">📌 Outro</option>
        </select>
      </div>
      <div class="grid-2">
        <div class="field"><label>Telefone</label><input type="text" id="f-tel" placeholder="251 000 000"></div>
        <div class="field"><label>Telemóvel</label><input type="text" id="f-tlm" placeholder="9xx 000 000"></div>
      </div>
      <div class="field"><label>Email</label><input type="email" id="f-email" placeholder="email@exemplo.pt"></div>
      <div class="field"><label>Morada</label><input type="text" id="f-morada" placeholder="Rua, localidade..."></div>
      <div class="field"><label>Website</label><input type="text" id="f-web" placeholder="www.exemplo.pt"></div>
      <div class="field"><label>Notas / Horários / Observações</label><textarea id="f-notas" placeholder="Pessoa de contacto, horários, observações..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn-del" id="btn-del" onclick="eliminarContacto()" style="display:none">Eliminar</button>
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="gravarContacto()">Gravar</button>
    </div>
  </div>
</div>

async function init() {
  if(!db) return;
  const snap = await db.collection('contactos').limit(1).get();
  if(snap.empty) {
    const batch = db.batch();
    INICIAIS.forEach((c,i) => {
      batch.set(db.collection('contactos').doc('INI-'+String(i).padStart(3,'0')), {...c, criadoEm: new Date().toISOString()});
    });
    await batch.commit();
  }
  carregar();
}

async function carregar() {
  if(!db) return;
  const snap = await db.collection('contactos').orderBy('nome','asc').get();
  todos = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderSidebar();
  filtrar();
}

function renderSidebar() {
  const cats = {};
  todos.forEach(c => { cats[c.cat] = (cats[c.cat]||0)+1; });
  const el = document.getElementById('sidebar-cats');
  const total = todos.length;
  el.innerHTML = `<div class="cat-item ${catActiva==='TODOS'?'active':''}" onclick="setCat('TODOS',this)"><span>Todos</span><span class="cat-count">${total}</span></div>`;
  // Ordem preferida
  const ordem = ['Emergência','Autarquia','Junta de Freguesia','Saúde','Segurança','Justiça / Notariado','Serviços Públicos','Igreja / Religioso','Parceiro / Fornecedor','Advogado / Solicitador','Frota / Mecânica','Cliente','Outro'];
  ordem.forEach(cat => {
    if(!cats[cat]) return;
    const icon = CAT_ICON[cat]||'📌';
    el.innerHTML += `<div class="cat-item ${catActiva===cat?'active':''}" onclick="setCat('${cat}',this)"><span>${icon} ${cat}</span><span class="cat-count">${cats[cat]}</span></div>`;
  });
}

function setCat(cat) {
  catActiva = cat;
  renderSidebar();
  filtrar();
}

function filtrar() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  let lista = todos;
  if(catActiva !== 'TODOS') lista = lista.filter(c=>c.cat===catActiva);
  if(q) lista = lista.filter(c=>(c.nome||'').toLowerCase().includes(q)||(c.telefone||'').includes(q)||(c.tlm||'').includes(q)||(c.email||'').toLowerCase().includes(q)||(c.morada||'').toLowerCase().includes(q)||(c.notas||'').toLowerCase().includes(q));
  render(lista);
}

function render(lista) {
  const grid = document.getElementById('contacts-grid');
  if(!lista.length){grid.innerHTML='<div class="empty-msg">Nenhum contacto encontrado.</div>';return;}
  grid.innerHTML = lista.map(c=>`
    <div class="contact-card">
      <div class="contact-main">
        <div class="contact-cat-badge">${CAT_ICON[c.cat]||'📌'} ${c.cat||'—'}</div>
        <div class="contact-nome">${c.nome||'—'}</div>
        <div class="contact-grid">
          ${c.telefone?`<div class="contact-linha"><span class="contact-icon">📞</span><a href="tel:${c.telefone.replace(/\s/g,'')}">${c.telefone}</a></div>`:''}
          ${c.tlm?`<div class="contact-linha"><span class="contact-icon">📱</span><a href="tel:${c.tlm.replace(/\s/g,'')}">${c.tlm}</a></div>`:''}
          ${c.email?`<div class="contact-linha"><span class="contact-icon">✉️</span><a href="mailto:${c.email}">${c.email}</a></div>`:''}
          ${c.morada?`<div class="contact-linha"><span class="contact-icon">📍</span><span>${c.morada}</span></div>`:''}
          ${c.web?`<div class="contact-linha"><span class="contact-icon">🌐</span><a href="${c.web.startsWith('http')?c.web:'https://'+c.web}" target="_blank">${c.web}</a></div>`:''}
        </div>
        ${c.notas?`<div class="contact-notas">📝 ${c.notas}</div>`:''}
      </div>
      <div class="contact-actions">
        <button class="action-btn" onclick="editar('${c.id}')">✏ Editar</button>
        ${c.telefone?`<button class="action-btn" onclick="location.href='tel:${c.telefone.replace(/\s/g,'')}'">📞 Ligar</button>`:''}
        ${c.email?`<button class="action-btn" onclick="location.href='mailto:${c.email}'">✉ Email</button>`:''}
      </div>
    </div>`).join('');
}

function abrirModal() {
  editId=null;
  document.getElementById('modal-titulo').textContent='Novo Contacto';
  ['f-nome','f-tel','f-tlm','f-email','f-morada','f-web','f-notas'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-cat').value='Outro';
  document.getElementById('btn-del').style.display='none';
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-nome').focus(),100);
}

function editar(id) {
  const c=todos.find(x=>x.id===id);if(!c)return;
  editId=id;
  document.getElementById('modal-titulo').textContent='Editar Contacto';
  document.getElementById('f-nome').value=c.nome||'';
  document.getElementById('f-cat').value=c.cat||'Outro';
  document.getElementById('f-tel').value=c.telefone||'';
  document.getElementById('f-tlm').value=c.tlm||'';
  document.getElementById('f-email').value=c.email||'';
  document.getElementById('f-morada').value=c.morada||'';
  document.getElementById('f-web').value=c.web||'';
  document.getElementById('f-notas').value=c.notas||'';
  document.getElementById('btn-del').style.display='';
  document.getElementById('overlay').classList.add('open');
}

function fecharModal(){document.getElementById('overlay').classList.remove('open');editId=null;}

async function gravarContacto() {
  if(!db)return;
  const nome=document.getElementById('f-nome').value.trim();
  if(!nome){document.getElementById('f-nome').focus();return;}
  const doc={nome,cat:document.getElementById('f-cat').value,telefone:document.getElementById('f-tel').value.trim(),tlm:document.getElementById('f-tlm').value.trim(),email:document.getElementById('f-email').value.trim(),morada:document.getElementById('f-morada').value.trim(),web:document.getElementById('f-web').value.trim(),notas:document.getElementById('f-notas').value.trim(),criadoEm:new Date().toISOString()};
  await db.collection('contactos').doc(editId||('CT-'+Date.now())).set(doc,{merge:true});
  fecharModal();
  carregar();
}

async function eliminarContacto(){
  if(!editId||!db)return;
  if(!confirm('Eliminar este contacto?'))return;
  await db.collection('contactos').doc(editId).delete();
  fecharModal();
  carregar();
}

init();
</script>
</body>
</html>
